name: bot-approve

# Probe: submit an approving review with GITHUB_TOKEN (needs "Allow GitHub Actions to create and
# approve pull requests"). Question: does github-actions[bot]'s approval satisfy required reviews
# and/or Code Owners review on main?
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Not a build: probe that approves PR number `pr` (typed number); nothing is built.
    inputs:
      pr:
        description: "PR number to approve"
        type: number
        required: true

permissions: {}

concurrency:
  group: bot-approve-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  approve:
    name: approve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # submit the review
    steps:
      - name: Approve the PR as github-actions[bot]
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: gh pr review "$PR" -R "$REPO" --approve --body "bot-approve.yml probe"
